name: Build Linux package
run-name: "🐧 Linux build — ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --add-data "assets/AutoClicker.ico:assets" --add-data "assets/AutoClicker.png:assets" --hidden-import=pystray._xorg --name AutoClicker main.py

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: ./packaging/linux/build_deb.sh "${{ steps.version.outputs.version }}"

      - name: Rename portable binary
        run: cp dist/AutoClicker installer_output/AutoClicker-linux

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-linux
          path: |
            installer_output/AutoClicker.deb
            installer_output/AutoClicker-linux

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/AutoClicker.deb
            installer_output/AutoClicker-linux
