name: Build Windows executable
run-name: "🪟 Windows build — ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --uac-admin --icon=assets/AutoClicker.ico --add-data "assets/AutoClicker.ico;assets" --hidden-import=pystray._win32 --name AutoClicker main.py

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $version = "0.0.0-dev"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-windows
          path: installer_output/AutoClickerSetup-windows.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/AutoClickerSetup-windows.exe
